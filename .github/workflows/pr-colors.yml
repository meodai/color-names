name: Colors on the site

# When a pull request that adds names is merged, a comment links each one to its
# page on names.color.pizza.
on:
  pull_request_target:
    types: [closed]

permissions:
  contents: read
  pull-requests: write

jobs:
  comment:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # main, which holds the merge already: GitHub won't check out a fork's commit here,
      # and the script only reads the list, never the pull request's code
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.14.0

      - name: Comment with the links
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BASE: ${{ github.event.pull_request.base.sha }}
          MERGED: ${{ github.event.pull_request.merge_commit_sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          body="$(node scripts/tools/pr-colors.js "$BASE" "$MERGED")"
          if [ -n "$body" ]; then
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi
